<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menote · 页面框架</title>
<style>
/* ============================================================
   Menote 页面框架（线框图）
   只表达「哪一块是什么」，不做视觉设计
   ============================================================ */
/* ============================================================
   主题令牌（Claude 橙白风格，与高保真原型同一套观感）
   浅色 = 默认；深色 = [data-theme="dark"]；由工具栏的主题开关切换
   ============================================================ */
:root{
  color-scheme:light;
  /* 2026-09-26 换色：与 menote-prototype.html 同步换成 Cloudflare 色系（原 Claude 暖色） */
  --bg:#ffffff;
  --bg-2:#f7f7f7;
  --panel:#ffffff;
  --line:#e0e0e0;
  --line-2:#c9c9c9;
  --text:#1d1d1d;
  --text-2:#4a4a4a;
  --muted:#6b6b6b;

  /* 线框专用色阶（浅底上虚线要比底色更深） */
  --wf-bg:#ffffff;
  --wf-fill:#f2f2f2;
  --wf-fill-2:#e8e8e8;
  --wf-line:#c9c9c9;
  --wf-line-2:#a8a8a8;
  --wf-text:#3a3a3a;
  --wf-muted:#6b6b6b;
  --wf-sel:#f6821f;
  --wf-sel-soft:rgba(246,130,31,.12);

  /* 线框结构性色 */
  --ph-stripe:rgba(29,29,29,.05);
  --ph-line:rgba(29,29,29,.09);
  --grid-line:rgba(29,29,29,.028);
  --overlay-fill:rgba(246,130,31,.05);
  --sel-ring:rgba(246,130,31,.16);

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161616;
  --bg-2:#1e1e1e;
  --panel:#242424;
  --line:#333333;
  --line-2:#4a4a4a;
  --text:#f2f2f2;
  --text-2:#bdbdbd;
  --muted:#8f8f8f;

  --wf-bg:#1a1a1a;
  --wf-fill:#242424;
  --wf-fill-2:#2d2d2d;
  --wf-line:#4a4a4a;
  --wf-line-2:#5c5c5c;
  --wf-text:#e0e0e0;
  --wf-muted:#9a9a9a;
  --wf-sel:#fbad41;
  --wf-sel-soft:rgba(251,173,65,.16);

  --ph-stripe:rgba(255,255,255,.035);
  --ph-line:rgba(255,255,255,.07);
  --grid-line:rgba(255,255,255,.028);
  --overlay-fill:rgba(251,173,65,.06);
  --sel-ring:rgba(251,173,65,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:13px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--wf-line-2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--wf-muted);background-clip:content-box}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
.ic{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   外壳
   ============================================================ */
.fw{display:flex;flex-direction:column;height:100vh;overflow:hidden}

.fw-top{
  flex:none;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--bg-2);
}
.fw-title{display:flex;align-items:center;gap:9px;flex:none;padding-right:14px;border-right:1px solid var(--line)}
.fw-title b{font-size:13.5px}
.fw-title span{font-size:11px;color:var(--muted)}

.fw-tabs{display:flex;gap:5px;overflow-x:auto;flex:1;padding:2px 0}
.fw-tabs::-webkit-scrollbar{height:0}
.fw-tab{
  flex:none;display:flex;align-items:center;gap:6px;height:29px;padding:0 11px;
  border-radius:7px;border:1px solid var(--line);background:var(--panel);
  font-size:12px;color:var(--text-2);white-space:nowrap;transition:.14s;
}
.fw-tab:hover{border-color:var(--line-2);color:var(--text)}
.fw-tab.on{background:var(--wf-sel-soft);border-color:var(--wf-sel);color:var(--wf-sel);font-weight:600}
.fw-tab .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.fw-tab.on .n{color:var(--wf-sel)}

.fw-tools{display:flex;align-items:center;gap:8px;flex:none}
.fw-sw{
  display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;
  border:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--muted);
  cursor:pointer;user-select:none;transition:.14s;
}
.fw-sw:hover{color:var(--text-2);border-color:var(--line-2)}
.fw-sw.on{color:var(--wf-sel);border-color:var(--wf-sel);background:var(--wf-sel-soft)}
.fw-sw .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.fw-sw.on .dot{background:var(--wf-sel)}

.fw-body{flex:1;display:flex;overflow:hidden;min-height:0}

/* 画布台 */
.fw-stage{
  flex:1;min-width:0;padding:20px;overflow:auto;display:flex;align-items:stretch;justify-content:center;
}
.fw-canvas{
  width:100%;max-width:1240px;min-height:520px;
  display:flex;flex-direction:column;gap:9px;
  background:var(--wf-bg);border:1px solid var(--line);border-radius:14px;padding:11px;
  transition:.2s;
}
.fw-canvas.grid{
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:22px 22px;
}
.fw-canvas.nonote .blk-note{display:none}
.fw-canvas.nonote .blk{padding:6px}

/* 说明面板 */
.fw-insp{
  width:326px;flex:none;border-left:1px solid var(--line);background:var(--bg-2);
  overflow-y:auto;padding:16px 16px 40px;
}
.insp-page{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.insp-page h2{font-size:15px;font-weight:650;margin-bottom:3px}
.insp-page .doc{font-family:var(--mono);font-size:10.5px;color:var(--wf-sel);margin-bottom:9px}
.insp-page p{font-size:12.5px;color:var(--text-2);line-height:1.75}
.insp-hint{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
.insp-hint .ic{margin-top:2px;color:var(--wf-sel)}

.insp-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.insp-chip{
  font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);
  color:var(--text-2);cursor:pointer;transition:.13s;
}
.insp-chip:hover{border-color:var(--wf-sel);color:var(--wf-sel)}

.insp-block h3{font-size:15px;font-weight:650;margin-bottom:4px}
.insp-block .doc{font-family:var(--mono);font-size:10.5px;color:var(--wf-sel);margin-bottom:10px}
.insp-block .sum{font-size:12.5px;color:var(--text-2);line-height:1.75;margin-bottom:12px}
.insp-block .lbl{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
.insp-block ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.insp-block li{font-size:12.5px;color:var(--text-2);line-height:1.65;padding-left:15px;position:relative}
.insp-block li::before{content:"";position:absolute;left:3px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--wf-sel);opacity:.7}
.insp-empty{font-size:12.5px;color:var(--muted);line-height:1.8}

/* ============================================================
   线框基础件
   ============================================================ */
.wf-page{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0}
.wf-row{display:flex;gap:9px;min-height:0}
.wf-col{display:flex;flex-direction:column;gap:9px;min-height:0}
.grow{flex:1;min-width:0;min-height:0}

.blk{
  position:relative;border:1px dashed var(--wf-line);border-radius:8px;background:var(--wf-fill);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 10px;text-align:center;cursor:pointer;transition:.13s;
  min-width:0;min-height:36px;overflow:hidden;
}
.blk:hover{border-color:var(--wf-line-2);background:var(--wf-fill-2)}
.blk.sel{border-style:solid;border-color:var(--wf-sel);background:var(--wf-sel-soft);box-shadow:0 0 0 2px var(--sel-ring)}
.blk-name{font-size:11.5px;font-weight:600;color:var(--wf-text);line-height:1.35}
.blk-note{font-size:10px;color:var(--wf-muted);line-height:1.45;max-width:100%}
.blk.sel .blk-name{color:var(--wf-sel)}

/* 容器块：可内嵌子块 */
.blk.box{align-items:stretch;justify-content:flex-start;padding:8px;gap:7px}
.blk.box>.cap{
  flex:none;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:var(--wf-text);padding:0 2px 6px;
}
.blk.box>.cap .sub{font-size:10px;color:var(--wf-muted);font-weight:400}
.blk.box>.cap::after{content:"";flex:1}
.blk.box>.cap::before{
  content:"";width:5px;height:5px;border-radius:2px;background:var(--wf-line-2);flex:none;
}
.blk.solid{border-style:solid;border-color:var(--wf-line)}
.blk.tiny{min-height:26px;padding:4px 7px}
.blk.flat{background:transparent}
.blk.mute{opacity:.62}

/* 行内块（横排小块的容器） */
.blk-strip{display:flex;gap:7px;min-height:0}
.blk-strip>*{flex:1;min-width:0}

/* 浮层示意 */
.wf-overlay{
  position:absolute;border:1px dashed var(--wf-sel);border-radius:10px;
  background:var(--overlay-fill);padding:7px;display:flex;flex-direction:column;gap:7px;
  backdrop-filter:blur(1px);
}
.wf-overlay>.tag{
  position:absolute;top:-9px;left:10px;font-size:9.5px;letter-spacing:.5px;
  background:var(--wf-bg);color:var(--wf-sel);padding:0 5px;font-weight:600;
}
.wf-overlay.tr{top:10px;right:10px;width:34%;bottom:10px}
.wf-overlay.center{left:50%;top:50%;transform:translate(-50%,-50%);width:42%}
.wf-overlay.br{bottom:10px;right:10px;width:210px}
.wf-rel{position:relative;min-height:0;min-width:0;flex:1;display:flex}

/* 占位条纹（表示"真实内容"） */
.ph{background-image:repeating-linear-gradient(45deg,var(--ph-stripe) 0 7px,transparent 7px 14px)}
.ph-line{height:6px;border-radius:3px;background:var(--ph-line)}
.ph-line.w60{width:60%}
.ph-line.w40{width:40%}
.ph-line.w80{width:80%}

/* 标注引线标签 */
.pin{
  position:absolute;font-size:9.5px;color:var(--wf-sel);font-weight:600;letter-spacing:.3px;
  background:var(--wf-bg);padding:0 5px;top:-8px;left:50%;transform:translateX(-50%);
  white-space:nowrap;border-radius:3px;
}

@media(max-width:1080px){
  .fw-insp{width:280px}
}
</style>
</head>
<body>
<div class="fw">
  <header class="fw-top">
    <div class="fw-title"><b>Menote · 页面框架</b><span>线框图 / 无内容</span></div>
    <div class="fw-tabs" id="tabs"></div>
    <div class="fw-tools">
      <div class="fw-sw" id="swTheme">主题：浅色</div>
      <div class="fw-sw on" id="swNote"><span class="dot"></span>块说明</div>
      <div class="fw-sw" id="swGrid"><span class="dot"></span>网格</div>
    </div>
  </header>
  <div class="fw-body">
    <main class="fw-stage"><div class="fw-canvas grid" id="canvas"></div></main>
    <aside class="fw-insp" id="insp"></aside>
  </div>
</div>
<script>
/* ============================================================
   2. 线框助手
   ============================================================ */
const blk = (id, cls, style) => {
  const b = B[id];
  return '<div class="blk' + (cls ? ' ' + cls : '') + '" data-b="' + id + '"'
    + (style ? ' style="' + style + '"' : '') + '>'
    + '<span class="blk-name">' + b.n + '</span>'
    + '<span class="blk-note">' + b.s + '</span></div>';
};
const cap = (t, sub) => '<div class="cap">' + t + (sub ? ' <span class="sub">' + sub + '</span>' : '') + '</div>';
const svgInfo = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></svg>';
const svgBack = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5L9 12l5.5 5.5"/></svg>';

/* ============================================================
   3. 页面定义
   ============================================================ */
const PAGES = [
{
  no:'00', name:'全局框架', doc:'7.4',
  intro:'整页 = 全宽顶栏 + 左右两栏。左侧功能栏固定宽度且不滚动，右侧主操作区随功能栏选择整体切换；抽屉、弹窗、轻提示是叠加在右侧之上的三类浮层。',
  render: () => `
  <div class="wf-page">
    ${blk('topbar', '', 'height:52px;flex:none')}
    <div class="wf-row grow">
      ${blk('fnbar', '', 'width:272px;flex:none')}
      <div class="wf-rel">
        ${blk('work', 'box solid', 'width:100%')}
        <div class="wf-overlay tr"><span class="tag">浮层 · 滑出</span>${blk('drawer', 'grow')}</div>
        <div class="wf-overlay center"><span class="tag">浮层 · 弹窗</span>${blk('modalUnlock')}</div>
        <div class="wf-overlay br" style="height:46px"><span class="tag">浮层</span>${blk('toast', 'grow')}</div>
      </div>
    </div>
  </div>`
},
{
  no:'01', name:'顶栏', doc:'7.4 / 6.9',
  intro:'全宽常驻，从左到右六个区块。隐私锁胶囊是所有页面唯一的全局锁状态入口，因此必须固定可见、不能藏在设置里；账户与设置紧邻其右侧，也是全站唯一账户入口。账户入口本身不跳页，点击弹出快捷菜单，「设置」是菜单里的一项（2026-09-26 更正；此前一度定为「点击直接进设置、不弹菜单」）；菜单里放哪些功能由 设置 › 通用 › 快捷菜单 配置。顶栏由 5 块变 6 块是 2026-09-26 由功能栏底部移回顶栏的结果。',
  render: () => `
  <div class="wf-page">
    <div class="blk box solid" style="flex:none">
      ${cap('顶栏', '全宽 · 常驻 · 不参与左右两栏')}
      <div class="blk-strip" style="height:96px">
        ${blk('brand')}${blk('crumb')}${blk('search')}${blk('syncPill')}${blk('capsule')}${blk('topAccount')}
      </div>
    </div>
    <div class="wf-row grow">
      ${blk('fnbar', 'mute', 'width:32%;flex:none')}
      ${blk('work', 'mute')}
    </div>
  </div>`
},
{
  no:'02', name:'功能栏', doc:'7.4 / v2 Q1',
  intro:'左侧固定栏，自上而下三段：新建按钮、快速录入框、导航（原底部账户与设置已于 2026-09-26 移回顶栏）。新建按钮一次点击即建笔记；导航顺序经用户确认（v2 Q1）为 首页 · Memo · 待办 · 最近编辑 · 收藏 · 笔记本 · 标签 · 加密空间；其中前三项均为纯视图跳转，2026-09-26 起压成一行「浏览三段」（保留原名、不带数字，点不同位置进不同页面，省下约 74px 纵向空间），造型做成下划线页签以区别于上方收录框的模式选择；「待办」自 v2 起是独立视图；表格与文件夹的新建入口在笔记本节点下。「加密空间」不设分组小标题、贴底固定在功能栏底部（2026-09-26 调整），导航区可滚动而它始终可见。录入框压缩为「输入区 / 附加项 / 模式行（模式在左、发布在右）」三行 —— 附加项紧贴输入区、位于模式选择之上，锁定为一排高度，且已去掉笔记模式的加密选项（M04-02）。',
  render: () => `
  <div class="wf-page" style="flex-direction:row">
    <div class="blk box solid" style="width:310px;flex:none">
      ${cap('功能栏', '固定宽度 · 内部滚动')}
      ${blk('newBtn', '', 'flex:none;height:42px')}
      <div class="blk box" style="flex:none">
        ${cap('快速录入框', '全站唯一的碎片录入入口')}
        ${blk('composerInput', '', 'height:46px;flex:none')}
        ${blk('composerExtra', 'solid', 'height:26px;flex:none')}
        <div class="wf-row" style="flex:none;height:32px">
          ${blk('modeTabs', 'grow')}
          ${blk('composerPublish', '', 'width:62px;flex:none')}
        </div>
      </div>
      <div class="blk box grow">
        ${cap('导航', 'v2 Q1 + 2026-09-26 调整：浏览三段 · 最近编辑 · 收藏 · 笔记本 · 标签（可滚动）')}
        ${blk('navSeg', 'solid', 'flex:none;height:30px')}
        ${blk('navMain', '', 'flex:none;height:54px')}
        ${blk('navNotebook', 'grow')}
        ${blk('nbAdd', '', 'flex:none;height:30px')}
        ${blk('navTags', '', 'flex:none;height:42px')}
      </div>
      ${blk('navVault', 'solid', 'flex:none;height:38px')}
    </div>
    ${blk('work', 'mute grow')}
  </div>`
},
{
  no:'03', name:'首页', doc:'7.4 / v2 M02-03 / 2026-10-04 布局重排',
  intro:'首页是主操作区的落地视图之一。概览数据全部由本地元数据计算，不发额外网络请求。是否使用首页由设置 › 通用 › 启动视图控制；未选首页时功能栏不显示首页项。锁定时来自 Memo 的部分以「已锁定」占位。【2026-10-04 布局重排·已定】整屏压成四段：页头一行（左「标题 + ⓘ」，右「条目统计读数」）、中部两栏（今日待办作唯一带框的主卡，最近动态作无框副块）、快捷方式一行裸行（去掉带边框的外壳）、快速导航三组胶囊。内容区 920px 上限居中（DESIGN.md §2.3，此前实现漏配）。这样做的原因：待办是唯一有「时间压力」的内容，统计与动态是回顾性的；把「卡片墙」收到只剩一块主卡，主次做在外壳上而不是靠 flex 比例暗示。',
  render: () => `
  <div class="wf-page">
    ${blk('homeHead', '', 'flex:none;height:48px')}
    <div class="wf-row" style="flex:none;height:126px">
      ${blk('homeToday', 'solid', 'flex:1.15')}
      ${blk('homeRecent', '', 'flex:1')}
    </div>
    <div style="flex:none;height:1px;background:var(--line-2)"></div>
    <div style="flex:none">
      ${cap('快捷方式', '裸行无外壳 · 与下面的胶囊导航分家')}
      ${blk('homeActs', 'grow')}
    </div>
    <div style="flex:1">
      ${cap('快速导航', '文件夹 / 标签 / 常用视图 三组')}
      ${blk('homeNav', 'grow')}
    </div>
  </div>`
},
{
  no:'04', name:'最近编辑 · 收藏 · 标签', doc:'7.4 / v2 Q8 / 2026-09-26 调整',
  intro:'这三种功能栏选择下，主操作区与笔记本同构：左列是条目列表（笔记与表格混排），点条目在右列直接打开阅读与编辑，与笔记本的呈现一致。经用户确认（v2 Q8），三个视图都不包含 Memo —— Memo 不用文件夹组织、也没有标题，混进来会破坏列表的一致性；代价是 Memo 中的标签不会让 Memo 出现在标签视图，按标签看 Memo 用时间轴筛选。滑出详情侧栏的能力保留，但不再由列表点击触发，仅用于主操作区使用中临时查看条目属性。',
  render: () => `
  <div class="wf-page">

/* ============================================================
   4. 渲染与交互
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const canvasEl = $('#canvas'), inspEl = $('#insp'), tabsEl = $('#tabs');
const state = { i:0, sel:null, note:true, grid:true, theme:'light' };

function renderTabs(){
  tabsEl.innerHTML = PAGES.map((p, i) =>
    '<button class="fw-tab' + (i === state.i ? ' on' : '') + '" data-i="' + i + '">'
    + '<span class="n">' + p.no + '</span>' + p.name + '</button>').join('');
}

function renderCanvas(){
  canvasEl.className = 'fw-canvas' + (state.grid ? ' grid' : '') + (state.note ? '' : ' nonote');
  canvasEl.innerHTML = PAGES[state.i].render();
  if(state.sel){
    const el = canvasEl.querySelector('[data-b="' + state.sel + '"]');
    if(el) el.classList.add('sel'); else state.sel = null;
  }
}

const blockIds = () => Array.from(new Set(
  Array.from(canvasEl.querySelectorAll('[data-b]')).map(e => e.dataset.b)));

function renderInsp(){
  const p = PAGES[state.i];

  if(state.sel && B[state.sel]){
    const b = B[state.sel];
    inspEl.innerHTML =
      '<div class="insp-block">'
      + '<h3>' + b.n + '</h3>'
      + '<div class="doc">文档 ' + b.d + '</div>'
      + '<div class="sum">' + b.s + '</div>'
      + (b.p && b.p.length
          ? '<div class="lbl">要点</div><ul>' + b.p.map(x => '<li>' + x + '</li>').join('') + '</ul>'
          : '')
      + '<div class="insp-hint" id="backPage" style="cursor:pointer">' + svgBack + '<span>返回页面说明</span></div>'
      + '</div>';
    $('#backPage').addEventListener('click', () => { state.sel = null; renderCanvas(); renderInsp(); });
    return;
  }

  const ids = blockIds();
  inspEl.innerHTML =
    '<div class="insp-page">'
    + '<h2>' + p.name + '</h2>'
    + '<div class="doc">文档 ' + p.doc + '</div>'
    + '<p>' + p.intro + '</p>'
    + '<div class="insp-hint">' + svgInfo + '<span>点击线框里的任一块，查看它的职责与文档出处</span></div>'
    + '</div>'
    + '<div class="lbl" style="font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px">本页区块（' + ids.length + '）</div>'
    + '<div class="insp-list">'
    + ids.map(id => '<span class="insp-chip" data-b="' + id + '">' + (B[id] ? B[id].n : id) + '</span>').join('')
    + '</div>';
}

function goPage(i){
  state.i = (i + PAGES.length) % PAGES.length;
  state.sel = null;
  renderTabs(); renderCanvas(); renderInsp();
}

/* 事件 */
tabsEl.addEventListener('click', e => {
  const t = e.target.closest('.fw-tab');
  if(t) goPage(+t.dataset.i);
});
canvasEl.addEventListener('click', e => {
  const el = e.target.closest('[data-b]');
  if(!el) return;
  state.sel = el.dataset.b;
  renderCanvas(); renderInsp();
});
inspEl.addEventListener('click', e => {
  const chip = e.target.closest('.insp-chip');
  if(!chip) return;
  state.sel = chip.dataset.b;
  renderCanvas(); renderInsp();
});

$('#swNote').addEventListener('click', function(){
  state.note = !state.note;
  this.classList.toggle('on', state.note);
  renderCanvas();
});
$('#swGrid').addEventListener('click', function(){
  state.grid = !state.grid;
  this.classList.toggle('on', state.grid);
  renderCanvas();
});

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight'){ goPage(state.i + 1); }
  else if(e.key === 'ArrowLeft'){ goPage(state.i - 1); }
  else if(e.key === 'Escape' && state.sel){ state.sel = null; renderCanvas(); renderInsp(); }
});

/* ============================================================
   5. 启动（须在 B 初始化之后）
   ============================================================ */
/* 主题开关：浅色（默认）/ 深色 —— 与高保真原型同一套 Claude 橙白令牌 */
const themeBtn = $('#swTheme');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  state.theme = t;
  themeBtn.textContent = '主题：' + (t === 'dark' ? '深色' : '浅色');
  themeBtn.classList.toggle('on', t === 'dark');
}
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
applyTheme('light');

goPage(0);
</script>
